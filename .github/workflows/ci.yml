name: Prism 8 Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install platform dependencies
        run: npm ci --legacy-peer-deps
        working-directory: apps/platform

      - name: Compile smart contracts
        run: npm run compile:contracts
        working-directory: apps/platform

      - name: Lint Check
        run: npm run lint
        working-directory: apps/platform

      - name: Static Typecheck
        run: npm run typecheck
        working-directory: apps/platform

      - name: Run Full Test Suite (Vitest, Contracts, Subgraph)
        run: npm run test:all
        working-directory: apps/platform
        env:
          DEMO_MODE: "true"
          NODE_ENV: "test"

      - name: Production Next.js Build
        run: npm run build
        working-directory: apps/platform
        env:
          DEMO_MODE: "true"
          NODE_ENV: "test"
          NEXT_PUBLIC_WORLD_APP_ID: "app_ci_test"
          WALLETCONNECT_PROJECT_ID: "3f8646b9a896a297e68bc39b9dae6fa3"
